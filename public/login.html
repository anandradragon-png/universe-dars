<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YupDar — Вход</title>
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Manrope', Roboto, sans-serif;
      background: #080808;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: linear-gradient(160deg, #1a1a14 0%, #0a0a0a 100%);
      border: 1.5px solid rgba(212,175,55,0.35);
      border-radius: 18px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .orb { font-size: 44px; margin-bottom: 10px; }
    h1 { font-size: 20px; color: #D4AF37; margin: 0 0 8px; letter-spacing: 0.5px; }
    p.lead { font-size: 14px; color: #bbb; line-height: 1.6; margin: 0 0 24px; }
    .tg-btn-wrap { display: flex; justify-content: center; margin-bottom: 16px; min-height: 46px; }
    .divider { color: #555; font-size: 12px; margin: 8px 0 14px; }
    .guest {
      display: inline-block;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(212,175,55,0.30);
      background: rgba(212,175,55,0.06);
      color: #D4AF37;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
    }
    .note { font-size: 11px; color: #666; margin-top: 16px; line-height: 1.5; }
    .err { color: #e06a6a; font-size: 13px; margin-top: 12px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="orb">&#128302;</div>
    <h1>Вход в YupDar</h1>
    <p class="lead">Войди через Telegram — и твой Дар, тариф и прогресс будут одни и те же в боте и на сайте.</p>

    <div class="tg-btn-wrap" id="tg-btn-wrap">
      <script async
        src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="YupDarBot"
        data-size="large"
        data-radius="10"
        data-onauth="onTelegramAuth(user)"
        data-request-access="write"></script>
    </div>

    <div class="divider">— или —</div>
    <a class="guest" href="/index.html?app=1">Продолжить без входа</a>

    <div class="err" id="err"></div>
    <div class="note">Вход через Telegram не требует пароля. Email не запрашиваем и рассылок не шлём.</div>
  </div>

  <script>
    // Колбэк официального Telegram Login Widget. Получаем подписанные данные,
    // отправляем на сервер для проверки подписи и выдачи токена веб-сессии.
    async function onTelegramAuth(user) {
      const errEl = document.getElementById('err');
      errEl.textContent = '';
      try {
        const r = await fetch('/api/tg-web-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
        });
        const j = await r.json();
        if (!r.ok || !j.token) {
          errEl.textContent = 'Не удалось войти: ' + (j.error || r.status);
          return;
        }
        // Токен веб-сессии — им api-client подтверждает identity (x-web-session).
        try { localStorage.setItem('_web_session', j.token); } catch (e) {}
        // Чистим анонимный веб-id, чтобы клиент больше не уходил в гостя.
        try { localStorage.removeItem('_web_uid'); } catch (e) {}
        window.location.href = '/index.html?app=1';
      } catch (e) {
        errEl.textContent = 'Ошибка соединения: ' + e.message;
      }
    }
  </script>
</body>
</html>
