<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YupDar — Вход</title>
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Manrope', Roboto, sans-serif;
      background: #080808;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: linear-gradient(160deg, #1a1a14 0%, #0a0a0a 100%);
      border: 1.5px solid rgba(212,175,55,0.35);
      border-radius: 18px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .orb { font-size: 40px; margin-bottom: 10px; }
    h1 { font-size: 22px; color: #D4AF37; margin: 0 0 22px; letter-spacing: 0.5px; }

    /* Единый вид всех кнопок меню */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid rgba(212,175,55,0.30);
      background: rgba(212,175,55,0.06);
      color: #D4AF37;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(212,175,55,0.12); }
    .btn.primary {
      background: #D4AF37;
      color: #1a1a14;
      border-color: #D4AF37;
      font-weight: 600;
    }
    .btn.primary:hover { background: #e4bf47; }
    .ico { font-size: 18px; line-height: 1; flex: 0 0 auto; }

    .err { color: #e06a6a; font-size: 13px; margin-top: 10px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="orb">&#128302;</div>
    <h1>Вход в ЮпДар</h1>

    <!-- Telegram: своя кнопка в общем стиле, открывает окно входа Telegram -->
    <button class="btn primary" id="tg-login" onclick="loginTelegram()">
      <span class="ico">&#9993;</span> Войти через Telegram
    </button>

    <!-- Google: своя жёлтая кнопка в общем стиле, открывает окно входа Google -->
    <button class="btn primary" id="google-login" onclick="loginGoogle()">
      <svg class="ico" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Вход через аккаунт Google
    </button>

    <div class="err" id="err"></div>
  </div>

  <!-- Библиотека виджета Telegram: даёт window.Telegram.Login.auth -->
  <script async src="https://telegram.org/js/telegram-widget.js?22"></script>
  <!-- Библиотека Google Identity Services: рисует кнопку и отдаёт id_token -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    var BOT_ID = '8662208423'; // публичный id @YupDarBot (не токен)
    var GOOGLE_CLIENT_ID = '92870739232-rv2av7o1gnjg26tl4q4ed5a6tghilvsp.apps.googleusercontent.com';

    // Своя жёлтая кнопка Google: используем OAuth token flow (не официальную
    // кнопку), чтобы вид совпадал с кнопкой Telegram. По клику Google открывает
    // окно входа и возвращает access_token — его проверяет сервер.
    // Реальный вход работает только на домене yupdar.com (он прописан в
    // Authorized JavaScript origins). В превью кнопка видна, но окно не откроется.
    var googleTokenClient = null;
    function initGoogle() {
      try {
        if (!(window.google && google.accounts && google.accounts.oauth2)) return;
        googleTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'openid email profile',
          callback: onGoogleToken
        });
      } catch (e) {}
    }
    window.addEventListener('load', initGoogle);

    function loginGoogle() {
      var err = document.getElementById('err');
      err.textContent = '';
      if (!googleTokenClient) {
        err.textContent = 'Google ещё грузится, попробуй ещё раз через секунду.';
        return;
      }
      googleTokenClient.requestAccessToken();
    }

    async function onGoogleToken(resp) {
      var err = document.getElementById('err');
      err.textContent = '';
      if (!resp || !resp.access_token) { err.textContent = 'Вход через Google отменён.'; return; }
      try {
        var r = await fetch('/api/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: resp.access_token })
        });
        var j = await r.json();
        if (!r.ok || !j.token) {
          err.textContent = j.error || ('Не удалось войти: ' + r.status);
          return;
        }
        try { localStorage.setItem('_web_session', j.token); } catch (e) {}
        try { localStorage.removeItem('_web_uid'); } catch (e) {}
        window.location.href = '/index.html?app=1';
      } catch (e) {
        err.textContent = 'Ошибка соединения: ' + e.message;
      }
    }

    // Открывает официальное окно входа Telegram (popup). После подтверждения
    // Telegram возвращает подписанные данные — их проверяет сервер.
    function loginTelegram() {
      var err = document.getElementById('err');
      err.textContent = '';
      if (!(window.Telegram && window.Telegram.Login && window.Telegram.Login.auth)) {
        err.textContent = 'Виджет Telegram ещё грузится, попробуй ещё раз через секунду.';
        return;
      }
      window.Telegram.Login.auth(
        { bot_id: BOT_ID, request_access: 'write' },
        function (user) {
          if (!user) { err.textContent = 'Вход через Telegram отменён.'; return; }
          onTelegramAuth(user);
        }
      );
    }

    async function onTelegramAuth(user) {
      var err = document.getElementById('err');
      err.textContent = '';
      try {
        var r = await fetch('/api/tg-web-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
        });
        var j = await r.json();
        if (!r.ok || !j.token) {
          err.textContent = 'Не удалось войти: ' + (j.error || r.status);
          return;
        }
        try { localStorage.setItem('_web_session', j.token); } catch (e) {}
        try { localStorage.removeItem('_web_uid'); } catch (e) {}
        window.location.href = '/index.html?app=1';
      } catch (e) {
        err.textContent = 'Ошибка соединения: ' + e.message;
      }
    }

  </script>
</body>
</html>
