<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YupDar — Вход</title>
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Manrope', Roboto, sans-serif;
      background: #080808;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: linear-gradient(160deg, #1a1a14 0%, #0a0a0a 100%);
      border: 1.5px solid rgba(212,175,55,0.35);
      border-radius: 18px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .orb { font-size: 40px; margin-bottom: 10px; }
    h1 { font-size: 22px; color: #D4AF37; margin: 0 0 8px; letter-spacing: 0.5px; }
    p.lead { font-size: 13.5px; color: #bbb; line-height: 1.6; margin: 0 0 22px; }

    /* Обёртка официального виджета Telegram (он рисует свою кнопку) */
    .tg-btn-wrap { display: flex; justify-content: center; margin-bottom: 12px; min-height: 46px; }

    .divider { color: #555; font-size: 12px; margin: 6px 0 12px; }

    /* Жёлтая кнопка Google в общем стиле */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid rgba(212,175,55,0.30);
      background: rgba(212,175,55,0.06);
      color: #D4AF37;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(212,175,55,0.12); }
    .ico { font-size: 18px; line-height: 1; flex: 0 0 auto; }

    .err { color: #e06a6a; font-size: 13px; margin-top: 12px; min-height: 16px; }
    .note { font-size: 11px; color: #666; margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="orb">&#128302;</div>
    <h1>Вход в ЮпДар</h1>
    <p class="lead">Войди через Telegram или Google — твой Дар, тариф и прогресс будут одни и те же в боте и на сайте. После входа 7 дней доступно всё приложение.</p>

    <!-- Официальный Telegram Login Widget: сам рисует кнопку и надёжно
         проводит вход во всех браузерах (проверенный способ Telegram).
         data-onauth вызывает глобальную onTelegramAuth(user). -->
    <div class="tg-btn-wrap" id="tg-btn-wrap">
      <script async
        src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="YupDarBot"
        data-size="large"
        data-radius="10"
        data-onauth="onTelegramAuth(user)"
        data-request-access="write"></script>
    </div>

    <div class="divider">— или —</div>

    <!-- Google: жёлтая кнопка в общем стиле, OAuth token flow -->
    <button class="btn" id="google-login" onclick="loginGoogle()">
      <svg class="ico" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Вход через аккаунт Google
    </button>

    <div class="err" id="err"></div>
    <div id="diag" style="display:none; font-size:11px; color:#c9a24a; margin-top:10px; word-break:break-all; text-align:left; background:rgba(212,175,55,0.06); border:1px solid rgba(212,175,55,0.25); border-radius:8px; padding:8px;"></div>
    <div class="note">Вход не требует пароля. Email не запрашиваем и рассылок не шлём.</div>
  </div>

  <!-- Библиотека Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    var GOOGLE_CLIENT_ID = '92870739232-rv2av7o1gnjg26tl4q4ed5a6tghilvsp.apps.googleusercontent.com';

    // Куда вернуть после входа. Приложение при 401 присылает ?return=<путь>,
    // чтобы вернуть юзера ровно туда, где он был. Берём ТОЛЬКО безопасный
    // относительный путь (начинается с одного «/», без «//» и без «:») — защита
    // от open-redirect на чужой домен. Иначе — в приложение по умолчанию.
    function safeReturnUrl() {
      try {
        var raw = new URLSearchParams(location.search).get('return') || '';
        raw = decodeURIComponent(raw);
        if (/^\/(?!\/)/.test(raw) && raw.indexOf(':') === -1) return raw;
      } catch (e) {}
      return '/index.html?app=1';
    }

    // Диагностика (временная): если api-client увёл сюда после 401 несмотря на
    // наличие токена — показываем причину от сервера, чтобы понять, почему вход
    // не «долетает». Света просто присылает скриншот этой строки.
    (function showDiag() {
      try {
        var q = new URLSearchParams(location.search);
        if (q.get('diag') !== '1') return;
        var el = document.getElementById('diag');
        if (!el) return;
        el.style.display = 'block';
        el.textContent = 'Диагностика входа: ручка ' + (q.get('p') || '?')
          + ' · код ' + (q.get('st') || '?')
          + ' · причина «' + (q.get('why') || '?') + '»'
          + ' · длина токена ' + (q.get('tok') || '0');

        // Живой перепроверочный запрос тем же токеном — отличаем «не долетает»
        // от «отвергнут». Читаем сохранённый токен, шлём вручную, показываем код.
        var diagTok = '';
        try { diagTok = localStorage.getItem('_diag_tok') || ''; } catch (e) {}
        if (diagTok) {
          // Проверка №1: дошёл ли заголовок x-web-session до сервера вообще.
          fetch('/api/echo-auth', { headers: { 'x-web-session': diagTok, 'Content-Type': 'application/json' } })
            .then(function (r) { return r.json().catch(function () { return {}; }); })
            .then(function (j) {
              el.textContent += '  ||  ЗАГОЛОВОК ДОШЁЛ: '
                + (j && j.has_web_session ? 'ДА (длина ' + j.web_session_len + ')' : 'НЕТ — вырезан по дороге');
            })
            .catch(function (e) {
              el.textContent += '  ||  ЭХО: ошибка сети ' + (e && e.message ? e.message : '');
            })
            .then(function () { try { localStorage.removeItem('_diag_tok'); } catch (e) {} });
        }
      } catch (e) {}
    })();

    // Общая обработка успешно выданного токена веб-сессии.
    function applySession(token) {
      try { localStorage.setItem('_web_session', token); } catch (e) {}
      try { localStorage.removeItem('_web_uid'); } catch (e) {}
      try { sessionStorage.removeItem('_auth_redirected'); } catch (e) {}
      try { sessionStorage.removeItem('_auth_hardreload'); } catch (e) {}
      // Возвращаемся в приложение с cache-buster: браузер мог держать СТАРЫЙ
      // кэш index.html/api-client, который не шлёт x-web-session → 401 → цикл
      // назад на вход. Уникальный _v заставляет взять свежий код, и токен
      // долетит до запроса.
      var dest = safeReturnUrl();
      var sep = dest.indexOf('?') === -1 ? '?' : '&';
      window.location.href = dest + sep + '_v=' + Date.now();
    }

    // ---- Telegram Login Widget (официальный, data-onauth) ----
    async function onTelegramAuth(user) {
      var err = document.getElementById('err');
      err.textContent = '';
      if (!user) { err.textContent = 'Вход через Telegram отменён.'; return; }
      try {
        var r = await fetch('/api/tg-web-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
        });
        var j = await r.json();
        if (!r.ok || !j.token) {
          err.textContent = 'Не удалось войти: ' + (j.error || r.status);
          return;
        }
        applySession(j.token);
      } catch (e) {
        err.textContent = 'Ошибка соединения: ' + e.message;
      }
    }

    // ---- Google (OAuth token flow, своя жёлтая кнопка) ----
    // Реальный вход работает только на домене yupdar.com (он прописан в
    // Authorized JavaScript origins). В превью окно не откроется.
    var googleTokenClient = null;
    function initGoogle() {
      try {
        if (!(window.google && google.accounts && google.accounts.oauth2)) return;
        googleTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'openid email profile',
          callback: onGoogleToken
        });
      } catch (e) {}
    }
    window.addEventListener('load', initGoogle);

    function loginGoogle() {
      var err = document.getElementById('err');
      err.textContent = '';
      if (!googleTokenClient) {
        err.textContent = 'Google ещё грузится, попробуй ещё раз через секунду.';
        return;
      }
      googleTokenClient.requestAccessToken();
    }

    async function onGoogleToken(resp) {
      var err = document.getElementById('err');
      err.textContent = '';
      if (!resp || !resp.access_token) { err.textContent = 'Вход через Google отменён.'; return; }
      try {
        var r = await fetch('/api/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: resp.access_token })
        });
        var j = await r.json();
        if (!r.ok || !j.token) {
          err.textContent = j.error || ('Не удалось войти: ' + r.status);
          return;
        }
        applySession(j.token);
      } catch (e) {
        err.textContent = 'Ошибка соединения: ' + e.message;
      }
    }
  </script>
</body>
</html>
